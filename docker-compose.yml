# Argus 环境编排：PostgreSQL + Redis + migrate + api + worker + web
#
# ⚠️ 本文件【只声明镜像，不做构建】—— 镜像必须先手动构建好：
#   docker build -t argus-backend .                     （api / worker 共用）
#   docker build --target migrate -t argus-migrate .    （一次性迁移容器）
#   docker build -t argus-dashboard ../dashboard        （web）
# 镜像缺失时 compose 会尝试 docker pull 并失败，【不会】自动构建 —— 这是有意的：
# 云端部署没有源码和构建网络，宁可明确报错，也不要悄悄在服务器上跑 npm ci。
#
# 在 backend 目录执行：
#   docker compose up -d                    拉起全部
#   docker compose up -d postgres redis     只起依赖（本机 npm run dev 时用）
#   docker compose ps                       看状态
#   docker compose logs -f api              看某个服务的日志
#   docker compose down                     收工 —— 不要加 -v，加了会连数据卷一起删
#
# 端口一览：
#   8080  web（宿主机 8080 → 容器内 80）
#   3000  api（容器）
#   5432  PostgreSQL
#   6379  Redis
#
# 平台自监控（Prometheus / Grafana）已移出本文件，原因见下方 services 末尾的注释。
# 两种开发方式并存：
#   · 容器化：docker compose up -d api worker
#   · 本机 node（更快、能断点）：docker compose up -d postgres redis，然后 npm run dev
# ⚠️ 两者都占 3000 端口，不要同时开。
#
# 数据存放：PostgreSQL 的数据在具名卷 argus-pg-data 里；容器删了它还在，
# 只有 down -v 才会真正删除。sourcemap 落盘在 argus-uploads 卷里，api 与 worker 共用。

# 项目名显式钉死为 argus。
# 历史原因：本目录原名是中文（终极项目），Compose 取目录名做项目名时会被规整成
# 空串，报 "project name must not be empty"，所有 docker compose 命令都会失败。
# 目录现已改名为 Argus，默认推导结果本就是 argus，这一行保留是为了让项目名
# （以及由此派生的网络名、容器名 argus-postgres-1）不随目录改名而漂移。
name: argus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      # 本地开发口令，仅监听本机端口；不要复用到其他环境
      POSTGRES_PASSWORD: argus
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    # api / worker 用 depends_on 的 service_healthy 等它就绪。
    # 少了这条 healthcheck，compose 会直接报 "dependency has no healthcheck"。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 未挂卷：重启后队列里的数据会丢（开发期可接受）。
    # 若要做到重启不丢任务，再加具名卷并开启 AOF 持久化。
    ports: ["6379:6379"]

  # ── 应用进程（M7-T6 一键全栈）──────────────────────────────────────────
  # 一次性任务容器：跑 `prisma migrate deploy && node scripts/seed.cjs`。
  # 跑完退出（exited 0），api / worker 才启动 —— 迁移失败就别带病上线。
  # 它用的是 Dockerfile 的 migrate 阶段（保留 devDeps，含 prisma CLI），
  # 不进最终交付镜像。
  #
  # ⚠️ 只声明 image、不写 build：部署时镜像由外部提供（本地构建后 docker load，
  #    或从镜像仓库 docker pull）。compose 只负责"用哪个镜像"，不负责"怎么构建"。
  #    本地构建：docker build --target migrate -t argus-migrate .
  #    （缺了 image 名就只剩 build 一条路，服务器上没有源码时必然失败）
  migrate:
    image: argus-migrate
    environment:
      DATABASE_URL: postgresql://argus:argus@postgres:5432/argus?schema=public
      # seed.cjs 用这两个建管理员账号；不传就用脚本里的默认值
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@argus.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-argus-admin-2026}
    depends_on:
      postgres:
        condition: service_healthy

  # api 与 worker 共用同一个镜像，只靠 command 区分入口。
  # 容器网络里互相访问用服务名 postgres / redis —— 不是 127.0.0.1。
  #
  # ⚠️ 只声明 image、不写 build（理由同 migrate，见上）。
  #    本地构建：docker build -t argus-backend .
  api:
    image: argus-backend:v1.0.1 
    environment:
      DATABASE_URL: postgresql://argus:argus@postgres:5432/argus?schema=public
      REDIS_HOST: redis
      # 从 backend/.env 读：compose 会自动加载同目录的 .env 做变量替换
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"
    ports: ["3000:3000"]
    volumes:
      # sourcemap 落盘要放在容器可写层之外，否则重建容器就丢
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    # 和 api 共用同一个镜像，此处不再声明 build
    image: argus-backend:v1.0.1 
    # 同一个镜像，换入口：worker 只消费队列，没有 HTTP 端口
    command: ["node", "dist/src/worker.js"]
    environment:
      DATABASE_URL: postgresql://argus:argus@postgres:5432/argus?schema=public
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      # 必须和 api 共用同一个卷：worker 要读 api 上传的 .map
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── 前端（M7-T6）───────────────────────────────────────────────────────
  # dashboard 编译成静态文件后由 nginx 提供，并把 /api/ 反代到 api 容器。
  # 只声明 image，不写 build：镜像由手动构建产出，与后端保持同一种工作方式。
  #   docker build -t argus-dashboard E:\Argus\dashboard
  web:
    image: argus-dashboard
    # 宿主机 8080 → 容器 80（避开 api 占用的 3000）
    ports: ["8080:80"]
    depends_on:
      - api

  # ── 平台自监控（M6-8）已移出本文件 ─────────────────────────────────────
  # Prometheus / Grafana 只在本地开发时看指标用；云端部署不传这两个镜像，
  # 所以不放进这份 compose —— 否则 docker compose up 会去 Docker Hub 拉
  # prom/prometheus 与 grafana/grafana，网络不好时会卡在那里。
  #
  # 代价：云端没有指标面板。api 的 /metrics 端点仍在，将来要接自建监控
  # 时直接从容器网络抓 api:3000/metrics 即可（见 deploy/prometheus/prometheus.yml）。
  #
  # 配置文件（prometheus.yml / alert-rules.yml / grafana provisioning）都还
  # 留在 deploy/ 下没删；本地想看图就把这两段从 git 历史里恢复出来单独跑。


volumes:
  pg-data:
    # 把真实卷名钉死。不写这一行的话，卷名会是「项目名_pg-data」（即 argus_pg-data），
    # 一旦改了项目目录名 / 项目名，Docker 就会建一个全新的空卷 —— 看起来像数据丢了。
    # 注意：卷名一直是 argus-pg-data，目录从「终极项目」改成 Argus 不影响已有数据。
    name: argus-pg-data

  # sourcemap 落盘目录。api 写、worker 读，重建容器不丢。
  uploads:
    name: argus-uploads

  # 注：prometheus-data / grafana-data 已随自监控一起移出本文件

