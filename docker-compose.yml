# Argus 本地环境：PostgreSQL + Redis + api + worker + Prometheus + Grafana
#
# 在 backend 目录执行：
#   docker compose up -d                    拉起全部（含 api / worker 容器）
#   docker compose up -d postgres redis     只起依赖（本机 npm run dev 时用）
#   docker compose ps                       看状态
#   docker compose logs -f api              看某个服务的日志
#   docker compose down                     收工 —— 不要加 -v，加了会连数据卷一起删
#
# 端口一览：
#   3000  api（容器）
#   5432  PostgreSQL
#   6379  Redis
#   9090  Prometheus（指标抓取与告警规则）
#   3001  Grafana（admin / argus-grafana-2026）
#
# 两种开发方式并存：
#   · 容器化（M7-T6）：docker compose up -d api worker
#   · 本机 node（更快、能断点）：docker compose up -d postgres redis，然后 npm run dev
# ⚠️ 两者都占 3000 端口，不要同时开。
#
# 数据存放：PostgreSQL 的数据在具名卷 argus-pg-data 里，Prometheus 的在
# argus-prometheus-data 里；容器删了它们还在，只有 down -v 才会真正删除。
# sourcemap 落盘在 argus-uploads 卷里，api 与 worker 共用。

# 项目名显式钉死为 argus。
# 历史原因：本目录原名是中文（终极项目），Compose 取目录名做项目名时会被规整成
# 空串，报 "project name must not be empty"，所有 docker compose 命令都会失败。
# 目录现已改名为 Argus，默认推导结果本就是 argus，这一行保留是为了让项目名
# （以及由此派生的网络名、容器名 argus-postgres-1）不随目录改名而漂移。
name: argus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      # 本地开发口令，仅监听本机端口；不要复用到其他环境
      POSTGRES_PASSWORD: argus
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    # api / worker 用 depends_on 的 service_healthy 等它就绪。
    # 少了这条 healthcheck，compose 会直接报 "dependency has no healthcheck"。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 未挂卷：重启后队列里的数据会丢（开发期可接受）。
    # 若要做到重启不丢任务，再加具名卷并开启 AOF 持久化。
    ports: ["6379:6379"]

  # ── 应用进程（M7-T6 一键全栈）──────────────────────────────────────────
  # 一次性任务容器：跑 `prisma migrate deploy && node scripts/seed.cjs`。
  # 跑完退出（exited 0），api / worker 才启动 —— 迁移失败就别带病上线。
  # 它用的是 Dockerfile 的 migrate 阶段（保留 devDeps，含 prisma CLI），
  # 不进最终交付镜像。
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://argus:argus@postgres:5432/argus?schema=public
      # seed.cjs 用这两个建管理员账号；不传就用脚本里的默认值
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@argus.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-argus-admin-2026}
    depends_on:
      postgres:
        condition: service_healthy

  # api 与 worker 共用同一个镜像（同一个 Dockerfile），只靠 command 区分入口。
  # 容器网络里互相访问用服务名 postgres / redis —— 不是 127.0.0.1。
  api:
    build: .
    image: argus-backend
    environment:
      DATABASE_URL: postgresql://argus:argus@postgres:5432/argus?schema=public
      REDIS_HOST: redis
      # 从 backend/.env 读：compose 会自动加载同目录的 .env 做变量替换
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"
    ports: ["3000:3000"]
    volumes:
      # sourcemap 落盘要放在容器可写层之外，否则重建容器就丢
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    image: argus-backend
    # 同一个镜像，换入口：worker 只消费队列，没有 HTTP 端口
    command: ["node", "dist/src/worker.js"]
    environment:
      DATABASE_URL: postgresql://argus:argus@postgres:5432/argus?schema=public
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      # 必须和 api 共用同一个卷：worker 要读 api 上传的 .map
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── 前端（M7-T6）───────────────────────────────────────────────────────
  # dashboard 编译成静态文件后由 nginx 提供，并把 /api/ 反代到 api 容器。
  # 只声明 image，不写 build：镜像由手动构建产出，与后端保持同一种工作方式。
  #   docker build -t argus-dashboard E:\Argus\dashboard
  web:
    image: argus-dashboard
    # 宿主机 8080 → 容器 80（避开 api 占用的 3000）
    ports: ["8080:80"]
    depends_on:
      - api

  # ── 平台自监控（M6-8）──────────────────────────────────────────────────
  # Prometheus 的目标配置见 deploy/prometheus/prometheus.yml。
  # 容器化之后 api / worker 也在同一网络里，target 可以从 host.docker.internal
  # 改成服务名 api:3000（见该文件的下一步演进）。
  prometheus:
    # 钉版本：latest 哪天变了存储格式或配置项，排查成本远高于升级收益
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      # 指标历史落在这里：容器重建不丢。保留 15 天（见 command）
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    # Windows / macOS 的 Docker Desktop 自带 host.docker.internal；
    # Linux 必须显式映射这一行，否则容器里解析不到"宿主机"
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:11.3.0
    # 宿主机 3001 → 容器 3000（3000 已被 API 占用）
    ports: ["3001:3000"]
    depends_on:
      - prometheus
    environment:
      # 开发凭据，与 backend/.env 的 ADMIN_* 一样只用于本机
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: argus-grafana-2026
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # 关掉匿名统计与更新检查：离线环境启动更快，也不往外发数据
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      # 数据源 + 面板全部 provisioning 自动配置 ——
      # "docker compose up 就能看到图"，不需要在界面上手点一遍
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  pg-data:
    # 把真实卷名钉死。不写这一行的话，卷名会是「项目名_pg-data」（即 argus_pg-data），
    # 一旦改了项目目录名 / 项目名，Docker 就会建一个全新的空卷 —— 看起来像数据丢了。
    # 注意：卷名一直是 argus-pg-data，目录从「终极项目」改成 Argus 不影响已有数据。
    name: argus-pg-data

  # sourcemap 落盘目录。api 写、worker 读，重建容器不丢。
  uploads:
    name: argus-uploads

  # 指标历史：容器重建/重启都不丢，只有 docker compose down -v 才会清
  prometheus-data:
    name: argus-prometheus-data

  # Grafana 自己的库（用户、偏好、面板编辑历史）。面板本身来自 provisioning，
  # 所以这个卷丢了也不影响"面板还能不能导入"
  grafana-data:
    name: argus-grafana-data
