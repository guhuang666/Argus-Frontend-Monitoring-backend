# Grafana 面板自动加载（M6-8）
#
# 把 deploy/grafana/dashboards/ 目录下的 JSON 全部挂进 "Argus" 文件夹。
# 容器里这个目录被挂到 /var/lib/grafana/dashboards（见 docker-compose.yml）。
#
# updateIntervalSeconds: 30 —— 改完 JSON 不用重启 Grafana，半分钟内自动重载，
# 调面板的时候省很多事。
apiVersion: 1

providers:
  - name: argus
    orgId: 1
    folder: Argus
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      # 目录结构即文件夹结构？我们这个目录是平铺的，关掉它免得 Grafana
      # 把目录名当成二级文件夹
      foldersFromFilesStructure: false
